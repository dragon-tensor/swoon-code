name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

defaults:
  run:
    working-directory: codebase

jobs:
  release:
    name: Verify and draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build verified release artifacts
        run: python scripts/release.py --out-dir dist --expected-tag "$GITHUB_REF_NAME"
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: codebase/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: swoon-${{ github.ref_name }}
          path: codebase/dist/
          if-no-files-found: error
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --draft --generate-notes
          --title "Swoon Code $GITHUB_REF_NAME"
