[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "swoon-code"
version = "0.1.0"
description = "A browser-backed ChatGPT relay and AEML protocol engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50,<2",
]

[project.scripts]
swoon = "swoon.cli:main"

[tool.setuptools.packages.find]
include = ["swoon*"]
