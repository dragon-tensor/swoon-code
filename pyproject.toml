[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swoon-code"
version = "0.1.0"
description = "A browser-backed ChatGPT relay and bounded AEML agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Swoon Code contributors"},
]
keywords = ["aeml", "agent", "coding-agent", "education", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.50,<2",
]

[project.urls]
Homepage = "https://github.com/dragon-tensor/swoon-code"
Documentation = "https://github.com/dragon-tensor/swoon-code#readme"
Issues = "https://github.com/dragon-tensor/swoon-code/issues"
Repository = "https://github.com/dragon-tensor/swoon-code.git"

[project.scripts]
swoon = "swoon.cli:main"

[tool.setuptools.packages.find]
include = ["swoon*"]
